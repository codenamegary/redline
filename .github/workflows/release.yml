name: Release artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Build web app
        run: bun run build:web

      - name: Build and package binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            platform="${target#bun-}"
            name="redline-$version-$platform"
            bun build --compile --minify \
              --define "REDLINE_VERSION=\"$version\"" \
              --target "$target" \
              packages/server/src/main.ts --outfile "dist/$name"
            mkdir -p "$name"
            cp "dist/$name" "$name/redline"
            cp -r dist/web "$name/web"
            printf '%s\n' "$version" > "$name/version.txt"
            tar -czf "dist/release/$name.tar.gz" "$name"
            rm -rf "$name"
          done
          (cd dist/release && sha256sum ./*.tar.gz > checksums.txt)

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/checksums.txt --clobber
